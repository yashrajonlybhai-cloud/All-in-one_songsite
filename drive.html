<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESI DRIVE | Night Drive Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent: #ff3e3e;
            --bg-blur: rgba(0, 0, 0, 0.6);
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }
        .heading { font-family: 'Syncopate', sans-serif; }

        /* Immersive Background System */
        #bg-overlay {
            position: fixed;
            inset: 0;
            background-size: cover;
            background-position: center;
            transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            transform: scale(1.05);
            z-index: -1;
        }
        .bg-zoom { transform: scale(1.1) !important; }

        /* Glassmorphism Bento */
        .bento-card {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            transition: all 0.4s ease;
        }
        .bento-card:hover { border-color: var(--accent); }

        /* Visualizer */
        .bar { width: 4px; height: 16px; background: var(--accent); border-radius: 2px; transition: height 0.2s ease; }
        .animating .bar { animation: bar-dance 1s infinite ease-in-out alternate; }
        @keyframes bar-dance { 
            0% { height: 5px; opacity: 0.3; } 
            100% { height: 35px; opacity: 1; } 
        }

        /* Screen Effects */
        #fx-layer { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
        .flash-fx { animation: flash 0.4s ease-out; }
        @keyframes flash { 0% { background: white; opacity: 0.8; } 100% { background: transparent; opacity: 0; } }
        
        .shake-fx { animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } }

        /* Hide Scrollbar */
        ::-webkit-scrollbar { display: none; }

        /* Car Dashboard UI */
        .dashboard-overlay {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 35vh;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.7) 70%, transparent 100%);
            z-index: 10;
            pointer-events: none;
        }

        .steering-wheel {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 400px;
            border: 20px solid #1a1a1a;
            border-radius: 50%;
            background: radial-gradient(circle, #2a2a2a 0%, #1a1a1a 100%);
            box-shadow: 0 0 30px rgba(255, 62, 62, 0.3), inset 0 0 20px rgba(0,0,0,0.5);
            pointer-events: auto;
        }

        .steering-wheel::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            background: linear-gradient(145deg, #3a3a3a, #1a1a1a);
            border-radius: 50%;
            border: 3px solid #ff3e3e;
            box-shadow: 0 0 15px rgba(255, 62, 62, 0.5);
        }

        .steering-wheel::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: #0a0a0a;
            border-radius: 50%;
            border: 2px solid #333;
        }

        .speedometer {
            position: absolute;
            bottom: 20px;
            left: 30px;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, #1a1a1a 0%, #0a0a0a 100%);
            border-radius: 50%;
            border: 3px solid #ff3e3e;
            box-shadow: 0 0 20px rgba(255, 62, 62, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .speed-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ff3e3e;
            font-family: 'Syncopate', sans-serif;
            text-shadow: 0 0 10px rgba(255, 62, 62, 0.8);
        }

        .speed-label {
            font-size: 0.7rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .rpm-gauge {
            position: absolute;
            bottom: 20px;
            right: 30px;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, #1a1a1a 0%, #0a0a0a 100%);
            border-radius: 50%;
            border: 2px solid #444;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .rpm-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #fff;
            font-family: 'Syncopate', sans-serif;
        }

        .rpm-label {
            font-size: 0.6rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .dashboard-lights {
            position: absolute;
            bottom: 180px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
        }

        .dash-light {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #333;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        .dash-light.active {
            background: #ff3e3e;
            box-shadow: 0 0 15px rgba(255, 62, 62, 0.8);
        }

        .dash-light.green { background: #00ff88; }
        .dash-light.blue { background: #00aaff; }
    </style>
</head>
<body>

    <div id="bg-overlay" style="background-image: url('https://images.unsplash.com/photo-1552519507-da3b142c6e3d?q=80&w=1920');"></div>
    <div id="fx-layer"></div>

    <!-- Car Dashboard Overlay -->
    <div class="dashboard-overlay">
        <div class="steering-wheel"></div>
        <div class="speedometer">
            <div class="speed-value" id="speed-display">0</div>
            <div class="speed-label">KM/H</div>
        </div>
        <div class="rpm-gauge">
            <div class="rpm-value" id="rpm-display">0</div>
            <div class="rpm-label">RPM x1000</div>
        </div>
        <div class="dashboard-lights">
            <div class="dash-light active"></div>
            <div class="dash-light green active"></div>
            <div class="dash-light blue"></div>
            <div class="dash-light"></div>
            <div class="dash-light active"></div>
        </div>
    </div>

    <!-- START MODAL -->
    <div id="entry-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/90 backdrop-blur-3xl">
        <div class="text-center">
            <div class="mb-6 inline-block p-4 border-2 border-red-600 rounded-full animate-pulse">
                <i class="fa-solid fa-car text-4xl text-red-600"></i>
            </div>
            <h1 class="heading text-6xl font-bold mb-2 tracking-tighter">NIGHT<span class="text-red-600">DRIVE</span></h1>
            <p class="text-gray-400 tracking-[0.5em] text-xs uppercase mb-10">3 AM GURGAON EXPERIENCE</p>
            <button onclick="initPlayer()" class="group relative px-12 py-5 overflow-hidden rounded-full bg-white text-black font-extrabold transition-all hover:bg-red-600 hover:text-white">
                <span class="relative z-10">START THE DRIVE</span>
            </button>
        </div>
    </div>

    <!-- MAIN APP LAYOUT -->
    <div id="app-ui" class="hidden opacity-0 h-screen w-full flex flex-col p-3 gap-3 transition-opacity duration-1000">
        
        <!-- TOP NAV -->
        <div class="flex justify-between items-center">
            <div class="bento-card px-3 py-2 flex items-center gap-3">
                <div class="relative">
                    <div class="w-2 h-2 bg-red-600 rounded-full"></div>
                    <div class="absolute inset-0 w-2 h-2 bg-red-600 rounded-full animate-ping"></div>
                </div>
                <span class="heading text-xs tracking-widest uppercase">Night Drive</span>
            </div>
            <div class="bento-card px-3 py-2">
                <span id="digital-clock" class="font-mono text-sm text-red-500">00:00:00</span>
            </div>
        </div>

        <!-- MIDDLE BENTO SECTION -->
        <div class="flex-1 grid grid-cols-12 gap-3">
            
            <!-- Main Display -->
            <div class="col-span-12 md:col-span-9 bento-card p-6 flex flex-col justify-end relative overflow-hidden">
                <div class="absolute top-4 right-4 flex gap-1 items-end h-8" id="visualizer">
                    <div class="bar" style="animation-delay: 0.1s"></div>
                    <div class="bar" style="animation-delay: 0.3s"></div>
                    <div class="bar" style="animation-delay: 0.5s"></div>
                    <div class="bar" style="animation-delay: 0.2s"></div>
                    <div class="bar" style="animation-delay: 0.4s"></div>
                </div>
                <h2 id="vibe-quote" class="text-2xl md:text-4xl font-black mb-2 leading-tight">"SHEESHA NICHE,<br>BASS FULL."</h2>
                <p id="track-info" class="text-red-500 font-bold tracking-widest uppercase text-xs">Streaming Live Playlist...</p>
            </div>

            <!-- Interaction Card -->
            <div class="col-span-12 md:col-span-3 bento-card p-4 flex flex-col gap-3">
                <h3 class="heading text-xs text-gray-500 mb-1">Quick Actions</h3>
                <div id="vibe-actions" class="grid grid-cols-1 gap-2">
                    <!-- Dynamic Buttons Here -->
                </div>
            </div>
        </div>

        <!-- PLAYER CONTROLS -->
        <div class="bento-card p-3 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <button onclick="prevVideo()" class="text-lg text-gray-400 hover:text-white"><i class="fa-solid fa-backward-step"></i></button>
                <button onclick="togglePlay()" id="master-play" class="w-12 h-12 bg-white text-black rounded-full flex items-center justify-center text-xl hover:scale-110 transition-transform">
                    <i class="fa-solid fa-play"></i>
                </button>
                <button onclick="nextVideo()" class="text-lg text-gray-400 hover:text-white"><i class="fa-solid fa-forward-step"></i></button>
            </div>

            <div class="flex-1 max-w-sm">
                <div class="flex justify-between text-xs text-gray-500 mb-1 uppercase tracking-widest">
                    <span>Music Volume</span>
                    <span id="vol-display">70%</span>
                </div>
                <input type="range" id="master-volume" class="w-full h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-red-600" oninput="setMainVolume(this.value)">
            </div>

            <div class="flex-1 max-w-sm">
                <div class="flex justify-between text-xs text-gray-500 mb-1 uppercase tracking-widest">
                    <span>Atmosphere Layer</span>
                    <span id="amb-display">40%</span>
                </div>
                <input type="range" id="ambient-volume" class="w-full h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-white" oninput="setAmbientVolume(this.value)">
            </div>
        </div>
    </div>

    <!-- YT Hidden Iframe -->
    <div id="player-anchor" class="hidden"></div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player;
        let ambient = new Audio();
        ambient.loop = true;
        let isPlaying = false;
        let currentPlaylistIndex = 0;
        let audioContext;
        let bassFilter;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player-anchor', {
                height: '0', width: '0',
                playerVars: { 'listType': 'playlist', 'list': CONFIG.playlists[0], 'autoplay': 0, 'shuffle': 1 },
                events: { 
                    'onReady': () => console.log("YT Engine Ready"),
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                const videoData = player.getVideoData();
                if (videoData && videoData.title) {
                    document.getElementById('track-info').innerText = videoData.title;
                }
            }
        }

        function initPlayer() {
            document.getElementById('entry-modal').classList.add('hidden');
            const ui = document.getElementById('app-ui');
            ui.classList.remove('hidden');
            setTimeout(() => ui.classList.add('opacity-100'), 100);
            
            // Setup Web Audio API for bass boost
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            bassFilter = audioContext.createBiquadFilter();
            bassFilter.type = 'lowshelf';
            bassFilter.frequency.value = 200;
            bassFilter.gain.value = 15;
            
            const source = audioContext.createMediaElementSource(ambient);
            source.connect(bassFilter);
            bassFilter.connect(audioContext.destination);
            
            setupUI();
            updateClock();
            setInterval(updateClock, 1000);
        }

        function setupUI() {
            document.getElementById('vibe-quote').innerHTML = CONFIG.quotes[Math.floor(Math.random() * CONFIG.quotes.length)];
            
            const actionBox = document.getElementById('vibe-actions');
            actionBox.innerHTML = CONFIG.actions.map(a => `
                <button onclick="${a.fn}" class="w-full flex items-center justify-between p-4 bg-white/5 rounded-xl hover:bg-white/10 transition-all border border-white/5">
                    <span class="text-sm font-bold tracking-widest uppercase">${a.name}</span>
                    <i class="fa-solid ${a.icon} text-red-500"></i>
                </button>
            `).join('');

            if(CONFIG.playlists.length > 1) {
                actionBox.innerHTML += `
                    <button onclick="switchPlaylist()" class="w-full flex items-center justify-between p-4 bg-red-600/20 rounded-xl hover:bg-red-600/30 transition-all border border-red-600/30">
                        <span class="text-sm font-bold tracking-widest uppercase">Switch Playlist (${currentPlaylistIndex + 1}/${CONFIG.playlists.length})</span>
                        <i class="fa-solid fa-shuffle text-red-500"></i>
                    </button>
                `;
            }

            if(player) {
                player.loadPlaylist({ listType: 'playlist', list: CONFIG.playlists[currentPlaylistIndex], 'shuffle': 1 });
            }

            ambient.src = CONFIG.ambient;
            ambient.volume = document.getElementById('ambient-volume').value / 100;
        }

        function switchPlaylist() {
            currentPlaylistIndex = (currentPlaylistIndex + 1) % CONFIG.playlists.length;
            
            if(player) {
                player.stopVideo();
                player.loadPlaylist({ listType: 'playlist', list: CONFIG.playlists[currentPlaylistIndex], 'shuffle': 1 });
                if(isPlaying) player.playVideo();
            }
            
            const switchBtn = document.querySelector('button[onclick="switchPlaylist()"]');
            if(switchBtn) {
                switchBtn.querySelector('span').innerText = `Switch Playlist (${currentPlaylistIndex + 1}/${CONFIG.playlists.length})`;
            }
        }

        function togglePlay() {
            const btn = document.getElementById('master-play');
            const viz = document.getElementById('visualizer');
            if(!player) return;
            if(!isPlaying) {
                player.playVideo();
                ambient.play();
                btn.innerHTML = '<i class="fa-solid fa-pause"></i>';
                viz.classList.add('animating');
                document.getElementById('bg-overlay').classList.add('bg-zoom');
            } else {
                player.pauseVideo();
                ambient.pause();
                btn.innerHTML = '<i class="fa-solid fa-play"></i>';
                viz.classList.remove('animating');
                document.getElementById('bg-overlay').classList.remove('bg-zoom');
            }
            isPlaying = !isPlaying;
        }

        function fxFlash() {
            const fx = document.getElementById('fx-layer');
            fx.classList.add('flash-fx');
            setTimeout(() => fx.classList.remove('flash-fx'), 400);
        }

        function fxHorn() {
            const sfx = new Audio('https://www.myinstants.com/media/sounds/indiahonking.mp3');
            sfx.play().catch(e => console.error('Horn sound error:', e));
        }

        function setMainVolume(val) {
            if(player) player.setVolume(val);
            document.getElementById('vol-display').innerText = val + '%';
        }

        function setAmbientVolume(val) {
            ambient.volume = val / 100;
            document.getElementById('amb-display').innerText = val + '%';
        }

        function nextVideo() { player.nextVideo(); }
        function prevVideo() { player.previousVideo(); }

        function updateClock() {
            const now = new Date();
            const options = { timeZone: 'Asia/Kolkata', hour12: true, hour: '2-digit', minute: '2-digit', second: '2-digit' };
            document.getElementById('digital-clock').innerText = now.toLocaleTimeString('en-IN', options);
        }

        function animateDashboard() {
            const speed = Math.floor(Math.random() * 40) + 60;
            const rpm = (Math.random() * 2 + 2).toFixed(1);
            document.getElementById('speed-display').innerText = speed;
            document.getElementById('rpm-display').innerText = rpm;
        }

        setInterval(animateDashboard, 2000);
    </script>
</body>
</html>

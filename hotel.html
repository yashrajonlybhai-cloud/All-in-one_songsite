<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESI VIBE | Penthouse Rain Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent: #ff3e3e;
            --bg-blur: rgba(0, 0, 0, 0.6);
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }
        .heading { font-family: 'Syncopate', sans-serif; }

        /* Immersive Background System */
        #bg-overlay {
            position: fixed;
            inset: 0;
            background-size: cover;
            background-position: center;
            transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            transform: scale(1.05);
            z-index: -1;
        }
        .bg-zoom { transform: scale(1.1) !important; }

        /* Glassmorphism Bento */
        .bento-card {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            transition: all 0.4s ease;
        }
        .bento-card:hover { border-color: var(--accent); }

        /* Visualizer */
        .bar { width: 4px; height: 16px; background: var(--accent); border-radius: 2px; transition: height 0.2s ease; }
        .animating .bar { animation: bar-dance 1s infinite ease-in-out alternate; }
        @keyframes bar-dance { 
            0% { height: 5px; opacity: 0.3; } 
            100% { height: 35px; opacity: 1; } 
        }

        /* Screen Effects */
        #fx-layer { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
        .flash-fx { animation: flash 0.4s ease-out; }
        @keyframes flash { 0% { background: white; opacity: 0.8; } 100% { background: transparent; opacity: 0; } }
        
        .shake-fx { animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } }

        /* Hide Scrollbar */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div id="bg-overlay" style="background-image: url('https://images.unsplash.com/photo-1512918728675-ed5a9ecdebfd?q=80&w=1920');"></div>
    <div id="fx-layer"></div>

    <!-- START MODAL -->
    <div id="entry-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/90 backdrop-blur-3xl">
        <div class="text-center">
            <div class="mb-6 inline-block p-4 border-2 border-red-600 rounded-full animate-pulse">
                <i class="fa-solid fa-cloud-moon text-4xl text-red-600"></i>
            </div>
            <h1 class="heading text-6xl font-bold mb-2 tracking-tighter">PENTHOUSE<span class="text-red-600">RAIN</span></h1>
            <p class="text-gray-400 tracking-[0.5em] text-xs uppercase mb-10">SUKOON OVERLOAD</p>
            <button onclick="initPlayer()" class="group relative px-12 py-5 overflow-hidden rounded-full bg-white text-black font-extrabold transition-all hover:bg-red-600 hover:text-white">
                <span class="relative z-10">ENTER LOUNGE</span>
            </button>
        </div>
    </div>

    <!-- MAIN APP LAYOUT -->
    <div id="app-ui" class="hidden opacity-0 h-screen w-full flex flex-col p-3 gap-3 transition-opacity duration-1000">
        
        <!-- TOP NAV -->
        <div class="flex justify-between items-center">
            <div class="bento-card px-3 py-2 flex items-center gap-3">
                <div class="relative">
                    <div class="w-2 h-2 bg-red-600 rounded-full"></div>
                    <div class="absolute inset-0 w-2 h-2 bg-red-600 rounded-full animate-ping"></div>
                </div>
                <span class="heading text-xs tracking-widest uppercase">Penthouse Rain</span>
            </div>
            <div class="bento-card px-3 py-2">
                <span id="digital-clock" class="font-mono text-sm text-red-500">00:00:00</span>
            </div>
        </div>

        <!-- MIDDLE BENTO SECTION -->
        <div class="flex-1 grid grid-cols-12 gap-3">
            
            <!-- Main Display -->
            <div class="col-span-12 md:col-span-9 bento-card p-6 flex flex-col justify-end relative overflow-hidden">
                <div class="absolute top-4 right-4 flex gap-1 items-end h-8" id="visualizer">
                    <div class="bar" style="animation-delay: 0.1s"></div>
                    <div class="bar" style="animation-delay: 0.3s"></div>
                    <div class="bar" style="animation-delay: 0.5s"></div>
                    <div class="bar" style="animation-delay: 0.2s"></div>
                    <div class="bar" style="animation-delay: 0.4s"></div>
                </div>
                <h2 id="vibe-quote" class="text-2xl md:text-4xl font-black mb-2 leading-tight">"SUKOON OVERLOAD."</h2>
                <p id="track-info" class="text-red-500 font-bold tracking-widest uppercase text-xs">Streaming Live Playlist...</p>
            </div>

            <!-- Interaction Card -->
            <div class="col-span-12 md:col-span-3 bento-card p-4 flex flex-col gap-3">
                <h3 class="heading text-xs text-gray-500 mb-1">Quick Actions</h3>
                <div id="vibe-actions" class="grid grid-cols-1 gap-2">
                    <!-- Dynamic Buttons Here -->
                </div>
            </div>
        </div>

        <!-- PLAYER CONTROLS -->
        <div class="bento-card p-3 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <button onclick="prevVideo()" class="text-lg text-gray-400 hover:text-white"><i class="fa-solid fa-backward-step"></i></button>
                <button onclick="togglePlay()" id="master-play" class="w-12 h-12 bg-white text-black rounded-full flex items-center justify-center text-xl hover:scale-110 transition-transform">
                    <i class="fa-solid fa-play"></i>
                </button>
                <button onclick="nextVideo()" class="text-lg text-gray-400 hover:text-white"><i class="fa-solid fa-forward-step"></i></button>
            </div>

            <div class="flex-1 max-w-sm">
                <div class="flex justify-between text-xs text-gray-500 mb-1 uppercase tracking-widest">
                    <span>Music Volume</span>
                    <span id="vol-display">70%</span>
                </div>
                <input type="range" id="master-volume" class="w-full h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-red-600" oninput="setMainVolume(this.value)">
            </div>

            <div class="flex-1 max-w-sm">
                <div class="flex justify-between text-xs text-gray-500 mb-1 uppercase tracking-widest">
                    <span>Atmosphere Layer</span>
                    <span id="amb-display">40%</span>
                </div>
                <input type="range" id="ambient-volume" class="w-full h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-white" oninput="setAmbientVolume(this.value)">
            </div>
        </div>
    </div>

    <!-- YT Hidden Iframe -->
    <div id="player-anchor" class="hidden"></div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player;
        let ambient = new Audio();
        ambient.loop = true;
        let isPlaying = false;
        let currentPlaylistIndex = 0;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player-anchor', {
                height: '0', width: '0',
                playerVars: { 'listType': 'playlist', 'list': CONFIG.playlists[0], 'autoplay': 0, 'shuffle': 1 },
                events: { 'onReady': () => console.log("YT Engine Ready") }
            });
        }

        function initPlayer() {
            document.getElementById('entry-modal').classList.add('hidden');
            const ui = document.getElementById('app-ui');
            ui.classList.remove('hidden');
            setTimeout(() => ui.classList.add('opacity-100'), 100);
            
            setupUI();
            updateClock();
            setInterval(updateClock, 1000);
        }

        function setupUI() {
            document.getElementById('vibe-quote').innerHTML = CONFIG.quotes[Math.floor(Math.random() * CONFIG.quotes.length)];
            
            const actionBox = document.getElementById('vibe-actions');
            actionBox.innerHTML = CONFIG.actions.map(a => `
                <button onclick="${a.fn}" class="w-full flex items-center justify-between p-4 bg-white/5 rounded-xl hover:bg-white/10 transition-all border border-white/5">
                    <span class="text-sm font-bold tracking-widest uppercase">${a.name}</span>
                    <i class="fa-solid ${a.icon} text-red-500"></i>
                </button>
            `).join('');

            if(player) {
                player.loadPlaylist({ listType: 'playlist', list: CONFIG.playlists[currentPlaylistIndex], 'shuffle': 1 });
            }

            ambient.src = CONFIG.ambient;
            ambient.volume = document.getElementById('ambient-volume').value / 100;
        }

        function togglePlay() {
            const btn = document.getElementById('master-play');
            const viz = document.getElementById('visualizer');
            if(!player) return;
            if(!isPlaying) {
                player.playVideo();
                ambient.play();
                btn.innerHTML = '<i class="fa-solid fa-pause"></i>';
                viz.classList.add('animating');
                document.getElementById('bg-overlay').classList.add('bg-zoom');
            } else {
                player.pauseVideo();
                ambient.pause();
                btn.innerHTML = '<i class="fa-solid fa-play"></i>';
                viz.classList.remove('animating');
                document.getElementById('bg-overlay').classList.remove('bg-zoom');
            }
            isPlaying = !isPlaying;
        }

        function fxWarmth() {
            document.getElementById('bg-overlay').style.filter = 
                document.getElementById('bg-overlay').style.filter === 'sepia(0.5)' ? 'none' : 'sepia(0.5)';
        }

        function setMainVolume(val) {
            if(player) player.setVolume(val);
            document.getElementById('vol-display').innerText = val + '%';
        }

        function setAmbientVolume(val) {
            ambient.volume = val / 100;
            document.getElementById('amb-display').innerText = val + '%';
        }

        function nextVideo() { player.nextVideo(); }
        function prevVideo() { player.previousVideo(); }

        function updateClock() {
            const now = new Date();
            const options = { timeZone: 'Asia/Kolkata', hour12: true, hour: '2-digit', minute: '2-digit', second: '2-digit' };
            document.getElementById('digital-clock').innerText = now.toLocaleTimeString('en-IN', options);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESI VIBE | Immersive Ambient Radio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent: #ff3e3e;
            --bg-blur: rgba(0, 0, 0, 0.6);
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }
        .heading { font-family: 'Syncopate', sans-serif; }

        /* Immersive Background System */
        #bg-overlay {
            position: fixed;
            inset: 0;
            background-size: cover;
            background-position: center;
            transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            transform: scale(1.05);
            z-index: -1;
        }
        .bg-zoom { transform: scale(1.1) !important; }

        /* Glassmorphism Bento */
        .bento-card {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            transition: all 0.4s ease;
        }
        .bento-card:hover { border-color: var(--accent); }

        /* Visualizer */
        .bar { width: 4px; height: 16px; background: var(--accent); border-radius: 2px; transition: height 0.2s ease; }
        .animating .bar { animation: bar-dance 1s infinite ease-in-out alternate; }
        @keyframes bar-dance { 
            0% { height: 5px; opacity: 0.3; } 
            100% { height: 35px; opacity: 1; } 
        }

        /* Screen Effects */
        #fx-layer { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
        .flash-fx { animation: flash 0.4s ease-out; }
        @keyframes flash { 0% { background: white; opacity: 0.8; } 100% { background: transparent; opacity: 0; } }
        
        .shake-fx { animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } }

        /* Pulse Strobe */
        .strobe-fx { animation: strobe 0.15s infinite; }
        @keyframes strobe { 0% { background: rgba(255, 0, 255, 0.2); } 100% { background: transparent; } }

        /* Hide Scrollbar */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div id="bg-overlay" style="background-image: url('https://images.unsplash.com/photo-1542281286-9e0a16bb7366?q=80&w=2070&auto=format&fit=crop');"></div>
    <div id="fx-layer"></div>

    <!-- START MODAL -->
    <div id="entry-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/90 backdrop-blur-3xl">
        <div class="text-center">
            <div class="mb-6 inline-block p-4 border-2 border-red-600 rounded-full animate-pulse">
                <i class="fa-solid fa-radio text-4xl text-red-600"></i>
            </div>
            <h1 class="heading text-6xl font-bold mb-2 tracking-tighter">DESI<span class="text-red-600">DRIVE</span></h1>
            <p class="text-gray-400 tracking-[0.5em] text-xs uppercase mb-10">Premium Ambient Experience</p>
            <button onclick="initPlayer()" class="group relative px-12 py-5 overflow-hidden rounded-full bg-white text-black font-extrabold transition-all hover:bg-red-600 hover:text-white">
                <span class="relative z-10">ENTER THE SESSION</span>
            </button>
        </div>
    </div>

    <!-- MAIN APP LAYOUT -->
    <div id="app-ui" class="hidden opacity-0 h-screen w-full flex flex-col p-3 gap-3 transition-opacity duration-1000">
        
        <!-- TOP NAV -->
        <div class="flex justify-between items-center">
            <div class="bento-card px-3 py-2 flex items-center gap-3">
                <div class="relative">
                    <div class="w-2 h-2 bg-red-600 rounded-full"></div>
                    <div class="absolute inset-0 w-2 h-2 bg-red-600 rounded-full animate-ping"></div>
                </div>
                <span class="heading text-xs tracking-widest uppercase" id="current-vibe-name">Night Drive</span>
            </div>
            <div class="bento-card px-3 py-2">
                <span id="digital-clock" class="font-mono text-sm text-red-500">00:00:00</span>
            </div>
        </div>

        <!-- MIDDLE BENTO SECTION -->
        <div class="flex-1 grid grid-cols-12 gap-3">
            
            <!-- Sidebar: Env Selector -->
            <div class="col-span-12 md:col-span-1 flex md:flex-col justify-around items-center bento-card py-3">
                <button onclick="changeVibe('drive')" class="vibe-btn text-xl transition-all hover:scale-125 text-red-500" title="Night Drive"><i class="fa-solid fa-car"></i></button>
                <button onclick="changeVibe('pub')" class="vibe-btn text-xl transition-all hover:scale-125 text-gray-500 hover:text-white" title="The Pub"><i class="fa-solid fa-champagne-glasses"></i></button>
                <button onclick="changeVibe('gym')" class="vibe-btn text-xl transition-all hover:scale-125 text-gray-500 hover:text-white" title="The Gym"><i class="fa-solid fa-dumbbell"></i></button>
                <button onclick="changeVibe('hotel')" class="vibe-btn text-xl transition-all hover:scale-125 text-gray-500 hover:text-white" title="Lounge"><i class="fa-solid fa-cloud-moon"></i></button>
            </div>

            <!-- Main Display -->
            <div class="col-span-12 md:col-span-8 bento-card p-6 flex flex-col justify-end relative overflow-hidden">
                <div class="absolute top-4 right-4 flex gap-1 items-end h-8" id="visualizer">
                    <div class="bar" style="animation-delay: 0.1s"></div>
                    <div class="bar" style="animation-delay: 0.3s"></div>
                    <div class="bar" style="animation-delay: 0.5s"></div>
                    <div class="bar" style="animation-delay: 0.2s"></div>
                    <div class="bar" style="animation-delay: 0.4s"></div>
                </div>
                <h2 id="vibe-quote" class="text-2xl md:text-4xl font-black mb-2 leading-tight">"3 AM GURGAON.<br>BASS FULL."</h2>
                <p id="track-info" class="text-red-500 font-bold tracking-widest uppercase text-xs">Streaming Live Playlist...</p>
            </div>

            <!-- Interaction Card -->
            <div class="col-span-12 md:col-span-3 bento-card p-4 flex flex-col gap-3">
                <h3 class="heading text-xs text-gray-500 mb-1">Quick Actions</h3>
                <div id="vibe-actions" class="grid grid-cols-1 gap-2">
                    <!-- Dynamic Buttons Here -->
                </div>
            </div>
        </div>

        <!-- PLAYER CONTROLS -->
        <div class="bento-card p-3 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <button onclick="prevVideo()" class="text-lg text-gray-400 hover:text-white"><i class="fa-solid fa-backward-step"></i></button>
                <button onclick="togglePlay()" id="master-play" class="w-12 h-12 bg-white text-black rounded-full flex items-center justify-center text-xl hover:scale-110 transition-transform">
                    <i class="fa-solid fa-play"></i>
                </button>
                <button onclick="nextVideo()" class="text-lg text-gray-400 hover:text-white"><i class="fa-solid fa-forward-step"></i></button>
            </div>

            <div class="flex-1 max-w-sm">
                <div class="flex justify-between text-xs text-gray-500 mb-1 uppercase tracking-widest">
                    <span>Music Volume</span>
                    <span id="vol-display">70%</span>
                </div>
                <input type="range" id="master-volume" class="w-full h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-red-600" oninput="setMainVolume(this.value)">
            </div>

            <div class="flex-1 max-w-sm">
                <div class="flex justify-between text-xs text-gray-500 mb-1 uppercase tracking-widest">
                    <span>Atmosphere Layer</span>
                    <span id="amb-display">40%</span>
                </div>
                <input type="range" id="ambient-volume" class="w-full h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-white" oninput="setAmbientVolume(this.value)">
            </div>
        </div>
    </div>

    <!-- YT Hidden Iframe -->
    <div id="player-anchor" class="hidden"></div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player;
        let ambient = new Audio();
        ambient.loop = true;
        let isPlaying = false;
        let currentVibe = 'drive';
        let currentPlaylistIndex = 0;
        let audioContext;
        let bassFilter;

        const CONFIG = {
            drive: {
                name: "Night Drive",
                image: "https://wallpapercave.com/wp/wp4524443.jpg",
                quotes: ["SHEESHA NICHE, BASS FULL.", "GURGAON EXPRESSWAY: 3 AM.", "HARYANVI TRAP MODE ON."],
                playlists: [
                    "PL4zY2tyCYAI0UMnMRD_Tx1LW6fX1RDkB9", 
                    "PLxnSPn2lnts32-aLcCqQFHmLuwPe1mJfo",
                    "PLxyXOYQmKoevrFZwNcodAhyb8K9HVJh6v",
                    "PLMZrLZeME_4lTyWp-NylAUTePr1Eu6CEj",
                    "PLMUccrAjEVQI5hKr_qEgeG-zxUnDtYDXS",
                    "PLK2DP7i3WzFYNhxhHexcJV7WlimGnbCEq",
                    "PL4goeKJ6227RB6bkBtAZ4Vb0inPm_BxRK",
                    "PL9PwPs7-UT5zVeW_VLU3eX4VOyW3fR8an"
                ],
                ambient: "https://assets.mixkit.co/sfx/preview/mixkit-car-interior-driving-loop-1160.mp3",
                actions: [
                    { name: "Pass Light", icon: "fa-sun", fn: "fxFlash()" },
                    { name: "Dual Horn", icon: "fa-bullhorn", fn: "fxHorn()" }
                ]
            },
            pub: {
                name: "Delhi Nightclub",
                image: "https://wallpapercrafter.com/desktop1/532380-bar-club-dance-dancing-music-nightclub-party.jpg",
                quotes: ["SCENE FULL ON HAI.", "DJ KO BOL BASS BADHA!", "NCR'S WILDEST NIGHTS."],
                playlists: ["PL--o-tfjAs5J7M5M5obyQPpmFnPi1a_Ev", "PLAPkb7TgtHQQb1e6xw9wAYch_fVtHD434", "PLr3fEIIQDP6U1eyfBYTJaKZOLAnW86e7f", "PLGN9MucJYRWt-1oeyAeXLanIJElUyKV5l", "PL2twrqzP6tpPEB7uB4nFUPrsS9MyX2Zo6", "PLHfO6lzPQFTm2FvDcmGtZPVeVAHCMqI8Y", "PLaWz7EDBElNn1SatTs94yRqAgY79Wa_fl", "PL6kG-M7dVg_yYYZh-oEbUCqo0lMFYbjoZ"],
                ambient: "https://www.soundjay.com/misc/sounds/bar-restaurant-chatter-01.mp3",
                actions: [
                    { name: "Strobe Lights", icon: "fa-lightbulb", fn: "fxStrobe()" },
                    { name: "Bottle Pop", icon: "fa-champagne-glasses", fn: "fxPop()" }
                ]
            },
            gym: {
                name: "Desi Iron Room",
                image: "https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=1920",
                quotes: ["AAJ LEGS DAY HAI BHAI.", "NO DAYS OFF.", "DESI MUSCLE POWER."],
                playlists: ["PLWd4gmX2j6dOUpWveHdipQ-vqlPX1A0f1", "PLCblVQ6I6dU_XFFCP-ly3JENtxjfB3eqr", "PLZ_8iFWmr3HpP6wQANSHroMZ6L9gBPPiv", "PLFL9XrWBEqFIrWEFTjPUKu7g1HDLgrCwY", "PL55SYfovLcjUEpbwVUqTh94zmciXnf9Ei"],
                ambient: "https://assets.mixkit.co/sfx/preview/mixkit-mechanical-fan-loop-2559.mp3",
                actions: [
                    { name: "Weight Drop", icon: "fa-anchor", fn: "fxShake()" }
                ]
            },
            hotel: {
                name: "Penthouse Rain",
                image: "https://images.unsplash.com/photo-1512918728675-ed5a9ecdebfd?q=80&w=1920",
                quotes: ["SUKOON OVERLOAD.", "CHAI, RAIN & SUFI.", "CITY LIGHTS, COLD NIGHTS."],
                playlists: ["PLBKAMaThXKIYYVw8xCA-XsWyLkmJ6qk5p"],
                ambient: "https://assets.mixkit.co/sfx/preview/mixkit-rain-on-window-interior-loop-2394.mp3",
                actions: [
                    { name: "Dim Lights", icon: "fa-moon", fn: "fxWarmth()" }
                ]
            }
        };

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player-anchor', {
                height: '0', width: '0',
                playerVars: { 'listType': 'playlist', 'list': CONFIG.drive.playlists[0], 'autoplay': 0, 'shuffle': 1 },
                events: { 
                    'onReady': () => console.log("YT Engine Ready"),
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                const videoData = player.getVideoData();
                if (videoData && videoData.title) {
                    document.getElementById('track-info').innerText = videoData.title;
                }
            }
        }

        function initPlayer() {
            document.getElementById('entry-modal').classList.add('hidden');
            const ui = document.getElementById('app-ui');
            ui.classList.remove('hidden');
            setTimeout(() => ui.classList.add('opacity-100'), 100);
            
            // Setup Web Audio API for bass boost
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            bassFilter = audioContext.createBiquadFilter();
            bassFilter.type = 'lowshelf';
            bassFilter.frequency.value = 200;
            bassFilter.gain.value = 15;
            
            const source = audioContext.createMediaElementSource(ambient);
            source.connect(bassFilter);
            bassFilter.connect(audioContext.destination);
            
            changeVibe('drive');
            updateClock();
            setInterval(updateClock, 1000);
        }

        function changeVibe(key) {
            const vibe = CONFIG[key];
            currentVibe = key;
            currentPlaylistIndex = 0;
            
            // Visual Updates
            document.getElementById('bg-overlay').style.backgroundImage = `url('${vibe.image}')`;
            document.getElementById('current-vibe-name').innerText = vibe.name;
            document.getElementById('vibe-quote').innerHTML = vibe.quotes[Math.floor(Math.random() * vibe.quotes.length)];
            
            // UI Button Active State
            document.querySelectorAll('.vibe-btn').forEach(btn => btn.classList.replace('text-white', 'text-gray-500'));
            
            // Action Buttons
            const actionBox = document.getElementById('vibe-actions');
            actionBox.innerHTML = vibe.actions.map(a => `
                <button onclick="${a.fn}" class="w-full flex items-center justify-between p-4 bg-white/5 rounded-xl hover:bg-white/10 transition-all border border-white/5">
                    <span class="text-sm font-bold tracking-widest uppercase">${a.name}</span>
                    <i class="fa-solid ${a.icon} text-red-500"></i>
                </button>
            `).join('');

            // Add playlist switcher button if multiple playlists exist
            if(vibe.playlists.length > 1) {
                actionBox.innerHTML += `
                    <button onclick="switchPlaylist()" class="w-full flex items-center justify-between p-4 bg-red-600/20 rounded-xl hover:bg-red-600/30 transition-all border border-red-600/30">
                        <span class="text-sm font-bold tracking-widest uppercase">Switch Playlist (${currentPlaylistIndex + 1}/${vibe.playlists.length})</span>
                        <i class="fa-solid fa-shuffle text-red-500"></i>
                    </button>
                `;
            }

            // Audio Switch
            if(player) {
                player.stopVideo();
                player.loadPlaylist({ listType: 'playlist', list: vibe.playlists[currentPlaylistIndex], 'shuffle': 1 });
                if(!isPlaying) player.pauseVideo();
            }

            ambient.src = vibe.ambient;
            ambient.volume = document.getElementById('ambient-volume').value / 100;
            if(isPlaying) ambient.play();
        }

        function switchPlaylist() {
            const vibe = CONFIG[currentVibe];
            currentPlaylistIndex = (currentPlaylistIndex + 1) % vibe.playlists.length;
            
            if(player) {
                player.stopVideo();
                player.loadPlaylist({ listType: 'playlist', list: vibe.playlists[currentPlaylistIndex], 'shuffle': 1 });
                if(isPlaying) player.playVideo();
            }
            
            // Update button text directly
            const switchBtn = document.querySelector('button[onclick="switchPlaylist()"]');
            if(switchBtn) {
                switchBtn.querySelector('span').innerText = `Switch Playlist (${currentPlaylistIndex + 1}/${vibe.playlists.length})`;
            }
        }

        function togglePlay() {
            const btn = document.getElementById('master-play');
            const viz = document.getElementById('visualizer');
            if(!player) return;
            if(!isPlaying) {
                player.playVideo();
                ambient.play();
                btn.innerHTML = '<i class="fa-solid fa-pause"></i>';
                viz.classList.add('animating');
                document.getElementById('bg-overlay').classList.add('bg-zoom');
            } else {
                player.pauseVideo();
                ambient.pause();
                btn.innerHTML = '<i class="fa-solid fa-play"></i>';
                viz.classList.remove('animating');
                document.getElementById('bg-overlay').classList.remove('bg-zoom');
            }
            isPlaying = !isPlaying;
        }

        // Action FX Functions
        function fxFlash() {
            const fx = document.getElementById('fx-layer');
            fx.classList.add('flash-fx');
            setTimeout(() => fx.classList.remove('flash-fx'), 400);
        }

        function fxHorn() {
            const sfx = new Audio('https://www.myinstants.com/media/sounds/indiahonking.mp3');
            sfx.play().catch(e => console.error('Horn sound error:', e));
        }

        function fxPop() {
            const sfx = new Audio('https://www.myinstants.com/media/sounds/beer-open-1.mp3');
            sfx.play().catch(e => console.error('Pop sound error:', e));
        }

        function fxShake() {
            document.getElementById('app-ui').classList.add('shake-fx');
            new Audio('https://www.soundjay.com/mechanical/iron-weights-clinking-1.mp3').play();
            setTimeout(() => document.getElementById('app-ui').classList.remove('shake-fx'), 300);
        }

        function fxStrobe() {
            document.getElementById('fx-layer').classList.toggle('strobe-fx');
        }

        function fxWarmth() {
            document.getElementById('bg-overlay').style.filter = 
                document.getElementById('bg-overlay').style.filter === 'sepia(0.5)' ? 'none' : 'sepia(0.5)';
        }

        // Mix Controls
        function setMainVolume(val) {
            if(player) player.setVolume(val);
            document.getElementById('vol-display').innerText = val + '%';
        }

        function setAmbientVolume(val) {
            ambient.volume = val / 100;
            document.getElementById('amb-display').innerText = val + '%';
        }

        function nextVideo() { player.nextVideo(); }
        function prevVideo() { player.previousVideo(); }

        function updateClock() {
            const now = new Date();
            const options = { timeZone: 'Asia/Kolkata', hour12: true, hour: '2-digit', minute: '2-digit', second: '2-digit' };
            document.getElementById('digital-clock').innerText = now.toLocaleTimeString('en-IN', options);
        }
    </script>
</body>
</html>
